<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浮光 — RTOR</title>
<meta name="description" content="浮光：走过的地方，一篇一篇。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2308080a'/><text x='32' y='43' font-family='-apple-system,sans-serif' font-size='25' font-weight='600' fill='%23f5f5f7' text-anchor='middle'>R</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">RTOR</a>
    <nav class="links">
      <a class="back" href="index.html">← 返回首页</a>
    </nav>
  </div>
</header>

<section class="masthead">
  <div class="wrap">
    <p class="mono">SECTION 01 — 浮光</p>
    <h1>浮光</h1>
    <p class="lede">走过的地方，一篇一篇。</p>
  </div>
</section>

<div class="wrap entry-list">
  <a class="entry reveal" href="lhasa.html">
    <img src="images/potala-card.webp" alt="布达拉宫夜色与水中倒影" width="1400" height="803">
    <span class="entry-copy">
      <span class="mono">01 · 西藏</span>
      <span class="entry-title">西藏篇</span>
    </span>
  </a>
</div>

<footer class="foot">
  <div class="wrap foot-inner">
    <span class="mono">© <span id="year">2026</span> RTOR</span>
    <a class="mono back" href="index.html">返回首页</a>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add('in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.12 });

  document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>

</body>
</html>
